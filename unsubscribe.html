<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/favicon-512.png" type="image/png" sizes="512x512">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Unsubscribe</title>
<meta name="robots" content="noindex">
<style>
@font-face{font-family:'Cormorant Garamond';font-style:normal;font-weight:600;font-display:swap;src:url('fonts/CormorantGaramond-600.woff2') format('woff2')}
@font-face{font-family:'Montserrat';font-style:normal;font-weight:400;font-display:swap;src:url('fonts/Montserrat-400.woff2') format('woff2')}
@font-face{font-family:'Montserrat';font-style:normal;font-weight:600;font-display:swap;src:url('fonts/Montserrat-600.woff2') format('woff2')}
:root{
  --ivory:#EDE8DD; --ink-on-light:#0A1B2E; --gold-ink:#7D5C15;
  --card:#FCFAF4; --radius:16px;
  --serif:'Cormorant Garamond',Georgia,serif;
  --sans:'Montserrat',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--sans);background:var(--ivory);color:var(--ink-on-light);line-height:1.65;font-weight:400;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;text-align:center}
.box{background:var(--card);border:1px solid rgba(10,27,46,.09);box-shadow:0 10px 30px rgba(10,27,46,.06);border-radius:var(--radius);padding:40px 32px;max-width:460px;width:100%}
h1{font-family:var(--serif);font-size:32px;font-weight:600;color:var(--ink-on-light);line-height:1.12;margin-bottom:12px}
p{font-size:15px;line-height:1.7;color:rgba(10,27,46,.82)}
#status{margin-top:6px;min-height:24px}
.ok{color:var(--gold-ink)}.err{color:#9E3B3D}
a{color:var(--gold-ink)}
</style>
</head>
<body>
<div class="box">
<h1>Unsubscribe</h1>
<p id="status">Processing your request…</p>
</div>
<script>
// The token is HMAC-signed by the sender; without a backend we cannot write to the
// suppression DB from this page. Instead: mailto fallback opens a pre-addressed email
// that the records pipeline ingests (opt-outs honored same day), and the page confirms intent.
const q = new URLSearchParams(location.search);
const e = q.get('e') || '', t = q.get('t') || '';
const st = document.getElementById('status');
if (e && t) {
  // Record the opt-out server-side FIRST (signed token -> ops API -> opt_outs);
  // the mailto below is the fallback if this fetch cannot reach the API.
  // innerHTML is safe here: the only interpolated value (e) passes through
  // encodeURIComponent, which escapes < > " ' - no untrusted HTML can enter.
  fetch('https://ops.hayessystems.com/api/unsubscribe?e=' + encodeURIComponent(e) + '&t=' + encodeURIComponent(t))
    .then(r => r.json())
    .then(j => { if (j.ok) { st.textContent = 'You are unsubscribed. No further emails or calls.'; st.className = 'ok'; } else { st.textContent = 'This link has expired. Reply to any email with the word STOP and you will be removed from all lists.'; st.className = 'err'; } })
    .catch(() => {
      const mail = 'mailto:Matt@hayessystems.com?subject=' + encodeURIComponent('UNSUBSCRIBE') +
                   '&body=' + encodeURIComponent('Unsubscribe: ' + e + '\nToken: ' + t + '\n');
      st.innerHTML = 'You are being unsubscribed. If your email program does not open automatically, <a href="' + mail + '">click here to confirm</a>. Requests are honored the same day and apply to all future outreach.';
      st.className = 'ok';
      setTimeout(() => { location.href = mail; }, 1200);
    });
} else {
  st.textContent = 'Invalid unsubscribe link. Reply to any email with the word STOP and you will be removed from all lists.';
  st.className = 'err';
}
</script>
</body>
</html>
