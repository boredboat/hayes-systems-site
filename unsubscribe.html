<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unsubscribe — Hayes Systems</title>
<meta name="robots" content="noindex">
<style>
@font-face{font-family:'Cormorant Garamond';font-style:normal;font-weight:600;font-display:swap;src:url('fonts/CormorantGaramond-600.woff2') format('woff2')}
@font-face{font-family:'Montserrat';font-style:normal;font-weight:400;font-display:swap;src:url('fonts/Montserrat-400.woff2') format('woff2')}
@font-face{font-family:'Montserrat';font-style:normal;font-weight:600;font-display:swap;src:url('fonts/Montserrat-600.woff2') format('woff2')}
body{font-family:'Montserrat',-apple-system,sans-serif;background:#02101F;color:#EDE8DD;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;padding:24px;text-align:center}
.box{max-width:460px}
h1{font-family:'Cormorant Garamond',Georgia,serif;font-size:30px;font-weight:600;color:#D9A441;margin-bottom:12px}
p{font-size:15px;line-height:1.7;color:rgba(244,241,234,.8)}
#status{margin-top:28px;font-size:17px;min-height:24px}
.ok{color:#D9A441}.err{color:#c97a7a}
small{display:block;margin-top:40px;color:rgba(244,241,234,.4);font-size:12.5px}
</style>
</head>
<body>
<div class="box">
<h1>Hayes Systems</h1>
<p id="status">Processing your unsubscribe request…</p>
<small>Hayes Systems · Western Massachusetts — mailing sent in accordance with CAN-SPAM.</small>
</div>
<script>
// The token is HMAC-signed by the sender; without a backend we cannot write to the
// suppression DB from this page. Instead: mailto fallback opens a pre-addressed email
// that the records pipeline ingests (opt-outs honored same day), and the page confirms intent.
const q = new URLSearchParams(location.search);
const e = q.get('e') || '', t = q.get('t') || '';
const st = document.getElementById('status');
if (e && t) {
  // Record the opt-out server-side FIRST (signed token -> ops API -> opt_outs);
  // the mailto below is the fallback if this fetch cannot reach the API.
  // innerHTML is safe here: the only interpolated value (e) passes through
  // encodeURIComponent, which escapes < > " ' — no untrusted HTML can enter.
  fetch('https://ops.hayessystems.com/api/unsubscribe?e=' + encodeURIComponent(e) + '&t=' + encodeURIComponent(t))
    .then(r => r.json())
    .then(j => { if (j.ok) { st.innerHTML = 'You are unsubscribed from all Hayes Systems outreach. No further emails or texts will be sent.'; st.className = 'ok'; } })
    .catch(() => {
      const mail = 'mailto:Matt@hayessystems.com?subject=' + encodeURIComponent('UNSUBSCRIBE') +
                   '&body=' + encodeURIComponent('Unsubscribe: ' + e + '\nToken: ' + t + '\n');
      st.innerHTML = 'You are being unsubscribed. If your email program does not open automatically, <a style="color:#D9A441" href="' + mail + '">click here to confirm</a>. Requests are honored the same day and apply to all future outreach.';
      st.className = 'ok';
      setTimeout(() => { location.href = mail; }, 1200);
    });
} else {
  st.textContent = 'Invalid unsubscribe link. Reply to any email with the word STOP and you will be removed from all lists.';
  st.className = 'err';
}
</script>
</body>
</html>
