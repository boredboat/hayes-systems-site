<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Connect your CRM — Hayes Systems</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/email-logo.png">
<style>
@font-face{font-family:'Cormorant Garamond';font-weight:600;font-display:swap;src:url('fonts/CormorantGaramond-600.woff2') format('woff2')}
@font-face{font-family:'Montserrat';font-weight:400;font-display:swap;src:url('fonts/Montserrat-400.woff2') format('woff2')}
@font-face{font-family:'Montserrat';font-weight:600;font-display:swap;src:url('fonts/Montserrat-600.woff2') format('woff2')}
:root{
  --navy:#02101F;
  --ivory:#EDE8DD; --cream:#FCFAF4;
  --gold:#D9A441; --gold-soft:rgba(217,164,65,.14);
  --ink-on-light:#0A1B2E; --gold-ink:#7D5C15;
  --serif:'Cormorant Garamond',Georgia,serif;
  --sans:'Montserrat',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--sans);background:var(--ivory);color:var(--ink-on-light);line-height:1.65;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:48px 24px}
.card{max-width:560px;width:100%;background:var(--cream);border:1px solid rgba(217,164,65,.45);border-radius:14px;padding:40px 38px}
.eyebrow{font-size:11.5px;letter-spacing:.22em;text-transform:uppercase;font-weight:600;color:var(--gold-ink)}
h1{font-family:var(--serif);font-weight:600;font-size:clamp(26px,4vw,32px);line-height:1.15;margin:10px 0 8px}
.sub{font-size:14.5px;color:rgba(10,27,46,.78);margin-bottom:24px}
label{display:block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--gold-ink);margin:18px 0 6px}
input[type=password],input[type=text]{width:100%;padding:13px 14px;font-family:var(--sans);font-size:14.5px;color:var(--ink-on-light);background:#fff;border:1px solid rgba(10,27,46,.25);border-radius:8px}
input:focus{outline:none;border-color:var(--gold)}
.btn{display:block;width:100%;margin-top:22px;padding:14px;border-radius:2px;background:var(--gold);color:var(--navy);font-size:13.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;border:none;cursor:pointer;font-family:var(--sans)}
.btn:disabled{opacity:.5;cursor:default}
.err{display:none;background:rgba(46,125,50,.10);border:1px solid rgba(46,125,50,.45);border-radius:8px;padding:12px 16px;font-size:13.5px;color:#256029;margin-top:16px}
.err.bad{background:rgba(158,59,59,.08);border-color:rgba(158,59,59,.3);color:#9E3B3D}
.fine{font-size:11.5px;color:rgba(10,27,46,.55);margin-top:20px;line-height:1.6}
.fine a{color:var(--gold-ink);text-decoration:underline}
#acct-row{display:none}
</style>
</head>
<body>
<div class="card">
  <span class="eyebrow">Hayes Systems</span>
  <h1 id="pg-title">Connect your CRM.</h1>
  <p class="sub" id="pg-sub">Please paste the token below and click "Connect". If the token is rejected check for missing or incorrect characters.</p>

  <div id="step1">
    <label for="token">API token</label>
    <input type="password" id="token" autocomplete="off">
    <div id="acct-row">
      <label for="acct">Account ID</label>
      <input type="text" id="acct" autocomplete="off" placeholder="From Settings, Account in kvCORE">
    </div>
    <button class="btn" id="go" disabled>Connect</button>
    <div class="err" id="err" hidden></div>
  </div>

  <p class="fine" id="fine-print">CRM connections are limited to the length of the campaign and are read only. See our <a href="https://www.hayessystems.com/privacy.html">privacy policy</a>.</p>
</div>
<script>
var API = 'https://ops.hayessystems.com';
var m = window.location.hash.match(/[#&]t=([a-f0-9]+)/);
var tok = m ? m[1] : '';
var platform = '', clientName = '', connected = false;
var go = document.getElementById('go'),
    tokenIn = document.getElementById('token'),
    acctIn = document.getElementById('acct'),
    err = document.getElementById('err');
function show(el, msg, bad){ el.textContent = msg; el.hidden = false; el.classList.toggle('bad', !!bad); }
function failState(title, msg){
  document.getElementById('step1').style.display = 'none';
  show(err, title + ' ' + msg, true);
}
if(!tok){
  failState('This link is missing its key.',
            'Open the connection link from your email, or email Matt@hayessystems.com.');
}
tokenIn.addEventListener('input', check);
acctIn.addEventListener('input', check);
function check(){
  var needAcct = document.getElementById('acct-row').style.display === 'block';
  go.disabled = !tokenIn.value.trim() || (needAcct && !acctIn.value.trim());
}
function renderHow(d){
  platform = d.platform || '';
  clientName = d.client || '';
  connected = !!d.connected;
  var label = d.platform_label || 'your CRM';
  document.getElementById('pg-title').textContent = 'Connect ' + label + '.';
  document.getElementById('acct-row').style.display = d.needs_account_id ? 'block' : 'none';
  if(connected){
    document.getElementById('pg-sub').textContent =
      'A connection is already active on this page\'s client record. Submitting a new token replaces the old one.';
  }
  check();
}
if(tok){
  fetch(API + '/api/crm/link/info?t=' + tok)
    .then(function(r){ return r.json(); })
    .then(renderHow)
    .catch(function(){ renderHow({}); });
}
go.addEventListener('click', function(){
  go.disabled = true; go.textContent = 'Checking...';
  err.hidden = true;
  fetch(API + '/api/crm/link/save', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({t: tok,
                          token: tokenIn.value.trim(),
                          account_id: acctIn.value.trim()})
  }).then(function(r){ return r.json(); }).then(function(d){
    go.disabled = false; go.textContent = 'Connect';
    if(!d.ok){
      show(err, d.error || 'The connection was not successful. Check the token and try again, or email Matt@hayessystems.com.', true);
      return;
    }
    show(err, 'The connection was successful.');
  }).catch(function(){
    go.disabled = false; go.textContent = 'Connect';
    show(err, 'Could not reach the server. Try again in a minute or email Matt@hayessystems.com.', true);
  });
});
</script>
</body>
</html>
