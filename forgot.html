<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
:root{--acc:#188bf6;--acch:#095dc3;--bg:#f6f6f6;--bd:#e5e7eb;--tx:#111827;--mut:#6b7280}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--tx);line-height:1.55;display:flex;flex-direction:column;min-height:100vh}
.bar{background:#fff;border-bottom:1px solid var(--bd)}
.bar .bin{display:flex;align-items:center;gap:12px;max-width:1000px;margin:0 auto;width:100%;padding:13px 28px}
.mark{width:28px;height:31px;flex-shrink:0}
.divider{width:1px;height:24px;background:var(--bd)}
.bname{font-weight:700;font-size:11px;letter-spacing:.14em;color:var(--tx);text-transform:uppercase;white-space:nowrap}
.bar .spacer{flex:1 0 12px}
.wrap{width:100%;max-width:460px;margin:7vh auto 0;padding:0 20px}
.card{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:34px 36px;box-shadow:0 10px 30px rgba(17,24,39,.06)}
h1{font-weight:700;font-size:21px;color:var(--tx);letter-spacing:-.01em}
.sub{font-size:14px;color:#4b5563;margin:6px 0 22px}
.field{margin-bottom:16px}
.field label{display:block;font-size:11.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--mut);margin-bottom:6px}
.field input{width:100%;padding:11px 13px;border:1px solid var(--bd);border-radius:8px;font-family:'Inter',sans-serif;font-size:14.5px;color:var(--tx);background:#fff}
.field input:focus{outline:none;border-color:var(--acc)}
.pwrow{position:relative}
.pwrow input{padding-right:64px}
.pwshow{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--mut);font-family:'Inter',sans-serif;font-size:12px;font-weight:600;padding:4px 6px;border-radius:6px}
.pwshow:hover{color:var(--tx);background:var(--bg)}
.hint{font-size:12.5px;color:var(--mut);margin-top:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:8px;padding:10px 18px;font-size:13.5px;font-weight:600;text-decoration:none;cursor:pointer;border:none;font-family:'Inter',sans-serif;transition:background .15s}
.btn-wide{width:100%}
.btn + .btn-wide,.btn-wide + .btn-wide{margin-top:10px}
.btn-primary{background:var(--acc);color:#fff}
.btn-primary:hover{background:var(--acch)}
.btn-primary:disabled{background:#c4cad3;color:#fff;cursor:not-allowed}
.btn-ghost{background:#fff;border:1px solid #d1d5db;color:var(--acc)}
.btn-ghost:hover:not(:disabled){border-color:var(--acc)}
.btn-ghost:disabled{color:#9ca3af;border-color:#e5e7eb;cursor:not-allowed}
.spin-sm{width:13px;height:13px;border:2px solid #d1d5db;border-top-color:var(--acc);border-radius:50%;animation:sp 1s linear infinite;display:inline-block;flex-shrink:0}
@keyframes sp{to{transform:rotate(360deg)}}
.hide{display:none !important}
.msg{font-size:13px;margin:0 0 12px}
.msg.err{color:#b91c1c}
.msg.ok{color:#15803d;font-size:14px}
.centerlink{text-align:center;margin-top:18px;font-size:13.5px}
a{color:var(--acc);font-weight:600;text-decoration:none}
a:hover{text-decoration:underline;text-underline-offset:3px}
.foot{border-top:1px solid #e5e7eb;margin:22px 0 0;padding-top:16px;font-size:13px;color:var(--mut);line-height:1.6}
.sbx-note{background:#fff7e0;border:1px solid #f3d68a;border-left:4px solid #E8A13A;border-radius:10px;padding:12px 16px;font-size:13px;color:#7a5a0d;line-height:1.55;margin:0 0 18px}
.sbx-note a{color:#7a5a0d;font-weight:700}
.badticket{background:#fef2f2;border:1px solid #fecaca;border-radius:10px;padding:14px 16px;margin:0 0 18px}
.badticket .badmsg{font-size:14px;font-weight:600;color:#b91c1c}
.badticket .badlinks{font-size:13px;color:#4b5563;margin-top:6px}
.success{background:#e8f9ee;border:1px solid #bbf7d0;border-radius:10px;padding:16px 18px}
.success .t{font-size:15px;font-weight:700;color:#15803d}
.success .d{font-size:13.5px;color:#374151;margin-top:4px;line-height:1.6}
.success .btn-wide{margin-top:14px}
.section{border-top:1px solid #e5e7eb;margin-top:24px;padding-top:20px}
.section h2{font-size:15px;font-weight:700;margin-bottom:14px}
.acts{display:flex;gap:10px;flex-wrap:wrap}
.acts .btn{flex:1 1 180px}
.who{font-size:14px;color:#4b5563;margin:6px 0 0}
</style></head><body>

</div></div>
<main class="wrap">
<div class="card">
  <h1>Forgot your password?</h1>
  <p class="sub">Enter the email on your account. If it matches, we will
  send you a link to choose a new one.</p>
  <form id="authForm" novalidate>
    <div class="field"><label for="email">Email</label>
      <input id="email" type="email" autocomplete="email"
      spellcheck="false" placeholder="you@yourcompany.com">
    </div>
    <p class="msg err hide" id="authErr"></p>
    <button type="submit" class="btn btn-primary btn-wide"
    id="sendBtn">Send reset link</button>
  </form>
  <div id="sentWrap" class="success hide">
    <p class="d">If an account uses that address, a reset link is on its
    way. Check your inbox.</p>
  </div>
  <p class="centerlink"><a href="login.html">Back to sign in</a></p>
</div>
</main>
<script src="auth.js"></script>
<script>
(function(){
  var em = $('email'), btn = $('sendBtn');
  var EMAIL_RE = /^[^@\s]+@[^@\s]+\.[^@\s]{2,}$/;
  function send(){
    var v = (em.value || '').trim();
    if (!EMAIL_RE.test(v)) {
      show('authErr', 'Enter the email address on your Hayes Systems'
        + ' account.');
      return;
    }
    clearMsg('authErr');
    busy(btn, true, 'Sending');
    post('/api/auth/reset-request', {email: v}).then(function(r){
      busy(btn, false, 'Send reset link');
      if (r.status === 200) {
        $('authForm').classList.add('hide');
        $('sentWrap').classList.remove('hide');
        return;
      }
      if (r.status === 400) {
        show('authErr', (r.j && r.j.message)
             || 'Check the address and try again.');
        return;
      }
      fail(r);
    });
  }
  btn.addEventListener('click', function(e){ e.preventDefault(); send(); });
  $('authForm').addEventListener('submit', function(e){
    e.preventDefault(); send();
  });
})();
</script>
